services:
  app:
    image: joe640/shop:f4a842682bba15063991df00613ee19feaa9dc25
    container_name: Ecommerce-app
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8080}:80"

    env_file:
      - .env

    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-Ecommerce}
      DB_USERNAME: ${DB_USERNAME:-Ecommerce}
      DB_PASSWORD: ${DB_PASSWORD:-secret}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - Ecommerce-network

  db:
    image: mariadb:11.4
    container_name: Ecommerce-db
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-Ecommerce}
      MARIADB_USER: ${DB_USERNAME:-Ecommerce}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-password}

    volumes:
      - Ecommerce-db-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - Ecommerce-network

volumes:
  Ecommerce-db-data:

networks:
  Ecommerce-network:
    driver: bridge
